<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:#f2f2f2;
    text-align:center;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#000;
    padding:15px;
    z-index:1000;
    border-bottom:1px solid #222;
}

nav a{
    color:#bbb;
    margin:10px;
    text-decoration:none;
    transition:0.3s;
}

nav a:hover{
    color:#fff;
}

/* HEADER */
header{
    padding:140px 20px 60px;
    background:#000;
}

h1{
    font-size:60px;
    letter-spacing:2px;
    color:#fff;
}

p{
    font-size:18px;
    color:#aaa;
}

/* SECTIONS */
section{
    padding:70px 20px;
}

/* IMAGES */
img{
    width:250px;
    border-radius:10px;
    filter:grayscale(100%);
    transition:0.3s;
}

img:hover{
    filter:grayscale(0%);
    transform:scale(1.05);
}

/* BUTTON */
a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#111;
    color:#fff;
    text-decoration:none;
    border:1px solid #333;
    border-radius:30px;
    transition:0.3s;
}

a:hover{
    background:#fff;
    color:#000;
}
    header{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
    body{
    animation:fadein 1s ease-in;
}

@keyframes fadein{
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>
